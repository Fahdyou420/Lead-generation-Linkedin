version: '3.8'

services:
  hunter_auto:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - playwright_sessions:/app/playwright_sessions
    env_file:
      - .env
    # Use host network on Linux, or host.docker.internal on Windows/Mac to reach local Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  playwright_sessions:
